; Ajustes de render para PCs con gráficos integrados (Radeon Vega / 8 GB RAM).
; Copia estas líneas al final de  C:\UE\CaracasSim\Config\DefaultEngine.ini  con el editor CERRADO.
; Si ya existe una sección [/Script/Engine.RendererSettings], pega solo las líneas dentro de ella.
; Para volver a máxima calidad (PC con GPU dedicada) borra este bloque.

[/Script/Engine.RendererSettings]
; Iluminación global y reflejos: sin Lumen (muy caro en iGPU)
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=2
; Sombras clásicas en cascada en vez de Virtual Shadow Maps
r.Shadow.Virtual.Enable=0
; Campos de distancia: dan oclusión ambiental y sombras suaves lejanas a bajo costo
r.GenerateMeshDistanceFields=True
r.DistanceFieldAO=1
; Anti-aliasing TSR (permite renderizar a menor resolución y reescalar)
r.AntiAliasingMethod=4
; Exposición automática más estable bajo el sol del trópico
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
; Nanite apagado por ahora (activarlo cuando haya GPU dedicada)
r.Nanite.ProjectEnabled=False

[/Script/Engine.Engine]
; Limita los FPS del editor para que la laptop no se sobrecaliente
bSmoothFrameRate=True
SmoothedFrameRateRange=(LowerBound=(Type=Inclusive,Value=22.000000),UpperBound=(Type=Exclusive,Value=45.000000))

[SystemSettings]
; Resolución interna al 67 % (TSR reescala a la pantalla)
r.ScreenPercentage=67
r.ViewDistanceScale=0.8
; Pool de texturas acorde a la memoria compartida de la iGPU (MB)
r.Streaming.PoolSize=1000
